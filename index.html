<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Becks – animated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EEF1F8; --ink:#141B36; --muted:#5B6584; --note:#B4511F;
  --navy-top:#3B4272; --navy-bot:#1D2347;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --page:#0E1226; --ink:#E9ECF7; --muted:#9AA3C2; --note:#F2915E; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#0E1226; --ink:#E9ECF7; --muted:#9AA3C2; --note:#F2915E; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;padding:24px}
main{width:min(560px,100%);display:grid;gap:20px;justify-items:center;text-align:center}
h1{margin:0;font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.5;max-width:46ch}
.note{color:var(--note);font-size:14px}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:1/1.08;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage:focus-visible{outline:3px solid #5B8CFF;outline-offset:6px;border-radius:28px}
.hex{position:absolute;inset:4% 2% 10% 2%;width:96%;height:86%}
.char{position:absolute;left:12%;right:12%;bottom:2%;aspect-ratio:770/910}
.shadow{position:absolute;left:24%;width:36%;bottom:-2.2%;height:5%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(8,12,40,.55),rgba(8,12,40,0));
  animation:shadow 3.2s ease-in-out infinite}
.body{position:absolute;inset:0;transform-origin:42% 100%;animation:breathe 3.2s ease-in-out infinite}
.body img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}

/* glows sit behind the art */
.glow{position:absolute;width:34%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  mix-blend-mode:screen;animation:pulse 2.6s ease-in-out infinite;pointer-events:none}
.glow.l{left:23.4%;top:12.6%;background:radial-gradient(closest-side,rgba(40,200,255,.9),rgba(40,200,255,.35) 45%,rgba(40,200,255,0))}
.glow.r{left:63.9%;top:12.1%;background:radial-gradient(closest-side,rgba(70,230,110,.85),rgba(70,230,110,.3) 45%,rgba(70,230,110,0));animation-delay:-1.3s}

/* blink lid, painted texture sampled from Becks's own body */
.lid{position:absolute;left:23.9%;width:33.2%;top:45.1%;height:26%;-webkit-mask-image:radial-gradient(closest-side,#000 94%,transparent 100%);mask-image:radial-gradient(closest-side,#000 94%,transparent 100%);pointer-events:none}

/* hover / tap reaction: anchored at the feet so they stay planted */
.stage:hover .body,.stage.poke .body,.stage:focus-visible .body{animation:wiggle .7s cubic-bezier(.3,1.6,.5,1) 1, breathe 3.2s ease-in-out .7s infinite}
.stage:hover .glow,.stage.poke .glow,.stage:focus-visible .glow{animation-duration:.9s;filter:brightness(1.35)}

@keyframes breathe{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(.985,1.03) rotate(-.6deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.94);opacity:.85}}
@keyframes pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes wiggle{0%{transform:scale(1,1)}20%{transform:scale(1.07,.92)}45%{transform:scale(.95,1.08) rotate(2deg)}65%{transform:scale(1.02,.98) rotate(-1.5deg)}100%{transform:scale(1,1) rotate(0)}}

@media (prefers-reduced-motion:reduce){
  .body,.shadow,.glow{animation:none!important}
  .glow{opacity:.85}
  .lid i{transition:none}
}
</style>

<script>
(()=>{
  const s=document.getElementById('stage');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const blink=(n=1)=>{s.classList.add('blink');setTimeout(()=>{s.classList.remove('blink');if(n>1)setTimeout(()=>blink(n-1),120)},140)};
  const loop=()=>{setTimeout(()=>{blink(Math.random()<.25?2:1);loop()},2400+Math.random()*3600)};
  if(!reduce) loop();
  const poke=()=>{s.classList.remove('poke');void s.offsetWidth;s.classList.add('poke');blink();setTimeout(()=>s.classList.remove('poke'),800)};
  s.addEventListener('pointerdown',poke);
  s.addEventListener('mouseenter',()=>blink());
  s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke()}});
})();
</script>
